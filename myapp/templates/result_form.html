{% extends 'base.html' %}
<title>{% block title %}Result Form{% endblock %}</title>

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">


        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{% if result %}Edit Result{% else %}Add Result{% endif %}</h4>
            </div>

            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text"
                               name="student_name"
                               class="form-control"
                               placeholder="Enter student name"
                               value="{{ result.student_name|default:'' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marks</label>
                        <input type="number"
                               name="marks"
                               class="form-control"
                               placeholder="Enter marks"
                               value="{{ result.marks|default:'' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Grade</label>
                        <input type="text"
                               name="grade"
                               class="form-control"
                               placeholder="Enter grade"
                               value="{{ result.grade|default:'' }}"
                               required>
                    </div>

                    <button type="submit" class="btn btn-success">
                        {% if result %}Update Result{% else %}Save Result{% endif %}
                    </button>

                    <a href="{% url 'result_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>
</div>


</div>

{% endblock %}
