{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">


        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if student %}
                        Edit Student
                    {% else %}
                        Add Student
                    {% endif %}
                </h4>
            </div>

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Student Name</label>

                        <input
                            type="text"
                            name="student_name"
                            class="form-control"
                            placeholder="Enter student name"
                            value="{{ student.student_name|default:'' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Student Image</label>

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                        >

                        {% if student and student.image %}
                            <div class="mt-2">
                                <img
                                    src="{{ student.image.url }}"
                                    alt="{{ student.student_name }}"
                                    width="80"
                                    height="80"
                                    class="rounded-circle"
                                >
                            </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Admission Date</label>

                        <input
                            type="date"
                            name="admission_date"
                            class="form-control"
                            value="{{ student.admission_date|date:'Y-m-d' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Name</label>

                        <input
                            type="text"
                            name="course_name"
                            class="form-control"
                            placeholder="Enter course name"
                            value="{{ student.course_name|default:'' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Fee</label>

                        <input
                            type="number"
                            name="course_fee"
                            class="form-control"
                            placeholder="Enter course fee"
                            value="{{ student.course_fee|default:'' }}"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success">
                        {% if student %}
                            Update Student
                        {% else %}
                            Save Student
                        {% endif %}
                    </button>

                    <a
                        href="{% url 'student_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>


</div>

{% endblock %}
